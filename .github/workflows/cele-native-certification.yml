name: CELE v3.21.7 Windows WebView2 IPC Certification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows_runner:
        description: Windows runner image
        required: true
        default: windows-2022
        type: choice
        options:
          - windows-2022
          - windows-2025

permissions:
  contents: read

jobs:
  certify-windows-webview-ipc:
    name: Native PDF/OCR + frozen frontend WebView2/Tauri IPC
    runs-on: ${{ inputs.windows_runner || 'windows-2022' }}
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct exact v3.21.7 certification payload
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'CELE_v3_21_6_Cloud_Certification_Payload.zip'
          $overlay = Join-Path $env:GITHUB_WORKSPACE 'CELE_v3_21_7_Overlay_From_v3_21_6.zip'
          if (-not (Test-Path -LiteralPath $base -PathType Leaf)) { throw 'Missing v3.21.6 base payload.' }
          if (-not (Test-Path -LiteralPath $overlay -PathType Leaf)) { throw 'Missing v3.21.7 overlay.' }
          $work = Join-Path $env:RUNNER_TEMP 'cele-v3217-rebuild'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'cele-cert'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $env:CELE_BASE_ZIP = $base
          $env:CELE_OVERLAY_ZIP = $overlay
          $env:CELE_REBUILD_DIR = $work
          $env:CELE_DEST_DIR = $dest
          @'
          import os, shutil, zipfile
          from pathlib import Path

          base = Path(os.environ["CELE_BASE_ZIP"])
          overlay = Path(os.environ["CELE_OVERLAY_ZIP"])
          work = Path(os.environ["CELE_REBUILD_DIR"])
          dest = Path(os.environ["CELE_DEST_DIR"])

          with zipfile.ZipFile(base) as z:
              z.extractall(work)

          src = work / "foundation_0_3_5"
          dst = work / "foundation_0_3_6"
          if not src.is_dir():
              raise SystemExit("v3.21.6 base payload missing foundation_0_3_5")
          src.rename(dst)

          with zipfile.ZipFile(overlay) as z:
              z.extractall(work)

          manifest = work / "OVERLAY_MANIFEST.json"
          if manifest.exists():
              manifest.unlink()

          for p in work.iterdir():
              target = dest / p.name
              if p.is_dir():
                  shutil.copytree(p, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(p, target)

          required = [
              dest / "foundation_0_3_6" / "scripts" / "windows-certify-cloud-v3217.ps1",
              dest / "foundation_0_3_6" / "src-tauri" / "src" / "main.rs",
              dest / "frontend_v3_21_0" / "index.html",
          ]
          for p in required:
              if not p.exists():
                  raise SystemExit(f"Reconstruction missing required path: {p}")

          print("Reconstructed v3.21.7 certification payload successfully.")
          for p in sorted(dest.iterdir()):
              print(p.name)
          '@ | python -

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select stable MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustc -Vv
          cargo -V

      - name: Run CELE WebView2/Tauri IPC certification
        id: certification
        continue-on-error: true
        shell: pwsh
        working-directory: cele-cert/foundation_0_3_6
        run: |
          .\scripts\windows-certify-cloud-v3217.ps1

      - name: Publish certification summary
        if: always()
        shell: pwsh
        run: |
          $summary = Join-Path $env:GITHUB_WORKSPACE 'cele-cert\foundation_0_3_6\release\native-certification\cloud-windows-certification-summary.json'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '# CELE v3.21.7 Windows WebView2/Tauri IPC Certification'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          if (Test-Path -LiteralPath $summary) {
            $s = Get-Content -Raw -LiteralPath $summary | ConvertFrom-Json
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Cloud status:** $($s.cloudCertificationStatus)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Portable regression:** $($s.portableRegressionStatus)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Native runtime:** $($s.nativeRuntimeStatus)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Frozen frontend WebView2/Tauri IPC:** $($s.webView2FrontendTauriIpcStatus)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Tauri release build:** $($s.tauriReleaseBuild)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **NSIS installer built:** $($s.nsisCertificationInstallerBuilt)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **nativeAdapterQA:** $($s.nativeAdapterQA)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '> Cloud PASS certifies the actual frozen frontend -> WebView2 -> Tauri IPC -> Rust path. Manual desktop/file-dialog/display/installer/signing gates remain.'
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- **Cloud status:** FAIL — summary file was not produced.'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Certification step outcome: ${{ steps.certification.outcome }}"
          }

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CELE-v3.21.7-windows-webview-ipc-certification-evidence-${{ inputs.windows_runner || 'windows-2022' }}
          path: |
            cele-cert/foundation_0_3_6/release/native-certification/**
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce WebView2 IPC certification result
        if: always()
        shell: pwsh
        run: |
          $summary = Join-Path $env:GITHUB_WORKSPACE 'cele-cert\foundation_0_3_6\release\native-certification\cloud-windows-certification-summary.json'
          if (-not (Test-Path -LiteralPath $summary)) { throw 'Certification summary was not produced.' }
          $s = Get-Content -Raw -LiteralPath $summary | ConvertFrom-Json
          if ($s.cloudCertificationStatus -eq 'BLOCKED') { throw 'WebView2 IPC certification was BLOCKED on this hosted runner. Evidence was uploaded.' }
          if ($s.cloudCertificationStatus -ne 'PASS') { throw 'WebView2 IPC certification failed. Evidence was uploaded.' }
          if (-not $s.webView2FrontendTauriIpcValidated) { throw 'Cloud gate reported PASS without WebView2/Tauri IPC validation.' }
          Write-Host 'CELE v3.21.7 cloud certification PASS: frozen frontend -> WebView2 -> Tauri IPC -> Rust executed successfully.'
