name: CELE v3.21.18 OCR Startup Root Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cele-ocr-startup-diagnostic-v32118.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct frozen frontend and inspect OCR startup symbols
        shell: python
        run: |
          import base64,hashlib,shutil,zipfile,re
          from pathlib import Path

          root=Path.cwd(); tmp=root/".ocr-diag"
          if tmp.exists(): shutil.rmtree(tmp)
          tmp.mkdir()
          with zipfile.ZipFile(root/"CELE_v3_21_6_Cloud_Certification_Payload.zip") as z:z.extractall(tmp)
          (tmp/"foundation_0_3_5").rename(tmp/"foundation_0_3_6")
          names=["part00.b64","part01.b64","part02.b64","part03.b64","part04.b64","part05a.b64","part05b.b64","part06.b64"]
          raw=base64.b64decode("".join((root/"v3217_overlay_parts"/n).read_text() for n in names),validate=True)
          assert hashlib.sha256(raw).hexdigest()=="fa627fa31932f278efa5a8ad6ec5155be5fb9e40899ddc421380d18f7d07a75a"
          op=tmp/"overlay.zip";op.write_bytes(raw)
          with zipfile.ZipFile(op) as z:z.extractall(tmp)

          front=tmp/"frontend_v3_21_0"
          files=[p for p in front.rglob("*") if p.is_file() and p.suffix.lower() in {".html",".js"}]

          print("=== ALL nativeOcrCurrentScanPage occurrences ===")
          for p in files:
              text=p.read_text(encoding="utf-8",errors="ignore")
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if "nativeOcrCurrentScanPage" in line:
                      print(f"\nFILE {p.relative_to(front)} LINE {i+1}")
                      for j in range(max(0,i-8),min(len(lines),i+10)):
                          print(f"{j+1:05d}: {lines[j]}")

          print("\n=== RELATED nativeOcr symbols ===")
          syms={}
          pat=re.compile(r"\bnativeOcr[A-Za-z0-9_]*\b")
          for p in files:
              text=p.read_text(encoding="utf-8",errors="ignore")
              for m in pat.finditer(text):
                  syms.setdefault(m.group(0),set()).add(str(p.relative_to(front)))
          for sym,paths in sorted(syms.items()):
              print(sym,"=>",sorted(paths))

          print("\n=== LIKELY CURRENT PAGE / OCR PAGE FUNCTIONS ===")
          for p in files:
              text=p.read_text(encoding="utf-8",errors="ignore")
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  lo=line.lower()
                  if ("ocr" in lo and "page" in lo and ("function " in lo or "=>" in line or "const " in lo or "let " in lo)) or "currentScanPage" in line:
                      if len(line)<1200:
                          print(f"{p.relative_to(front)}:{i+1}: {line}")

          print("\n=== SCRIPT ORDER AROUND OCR TRANSPORT ===")
          html=(front/"CELE_Topnotcher_OS_v3_21_0.html").read_text(encoding="utf-8")
          for idx,m in enumerate(re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I),1):
              src=m.group(1)
              if "ocr" in src.lower() or "native" in src.lower() or "inline" in src.lower() or "desktop" in src.lower():
                  print(idx,src)
