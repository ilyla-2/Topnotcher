name: CELE v3.21.11 Installed-App Lifecycle Certification

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  installed-lifecycle:
    name: Exact RC1 install, launch, reinstall, uninstall
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout release certification scripts
        uses: actions/checkout@v4

      - name: Download frozen v3.21.10 RC1 artifact
        uses: actions/download-artifact@v4
        with:
          name: CELE-Topnotcher-OS-v3.21.10-RC1-UNSIGNED-Windows-x64
          path: frozen-rc1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ilyla-2/Topnotcher
          run-id: 35894857839

      - name: Certify installed-app lifecycle
        shell: pwsh
        run: |
          .\scripts\certify-installed-lifecycle-v32111.ps1 -ArtifactRoot .\frozen-rc1 -OutputDirectory .\lifecycle-evidence

      - name: Publish lifecycle summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '# CELE v3.21.11 — Installed-App Lifecycle Certification'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          $p = 'lifecycle-evidence\v3.21.11-installed-app-lifecycle-report.json'
          if (Test-Path $p) {
            $r = Get-Content -Raw $p | ConvertFrom-Json
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Lifecycle status:** $($r.status)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Install:** $($r.scope.automatedInstall)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Installed WebView2/Tauri IPC:** $($r.scope.automatedInstalledWebViewTauriIpc)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Same-version reinstall:** $($r.scope.automatedSameVersionReinstall)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Uninstall:** $($r.scope.automatedUninstall)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Version-to-version upgrade:** $($r.scope.versionToVersionUpgrade)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **releaseReady:** false"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '> This automated certificate does not replace human file-picker/DPI inspection, code signing, or final redistribution review.'
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Lifecycle report was not produced.'
          }

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CELE-v3.21.11-installed-app-lifecycle-evidence
          path: lifecycle-evidence/**
          if-no-files-found: warn
          retention-days: 90
