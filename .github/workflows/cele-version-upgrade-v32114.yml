name: CELE v3.21.14 Version Upgrade Certification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cele-version-upgrade-v32114.yml'
      - 'scripts/certify-version-upgrade-v32114.ps1'

permissions:
  contents: read
  actions: read

jobs:
  version-upgrade:
    name: Install 0.3.6, upgrade to 0.3.7, certify, uninstall
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Download frozen RC2
        uses: actions/download-artifact@v4
        with:
          name: CELE-Topnotcher-OS-v3.21.12-RC2-UNSIGNED-Windows-x64
          path: frozen-rc2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ilyla-2/Topnotcher
          run-id: 35897863593

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select stable MSVC Rust
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustc -Vv
          cargo -V

      - name: Reconstruct exact certified source
        shell: python
        run: |
          import base64,hashlib,shutil,zipfile
          from pathlib import Path
          root=Path.cwd();tmp=root/".tmp-v32114";out=root/"upgrade-source"
          if tmp.exists(): shutil.rmtree(tmp)
          if out.exists(): shutil.rmtree(out)
          tmp.mkdir();out.mkdir()
          with zipfile.ZipFile(root/"CELE_v3_21_6_Cloud_Certification_Payload.zip") as z:z.extractall(tmp)
          (tmp/"foundation_0_3_5").rename(tmp/"foundation_0_3_6")
          names=["part00.b64","part01.b64","part02.b64","part03.b64","part04.b64","part05a.b64","part05b.b64","part06.b64"]
          raw=base64.b64decode("".join((root/"v3217_overlay_parts"/n).read_text() for n in names),validate=True)
          assert hashlib.sha256(raw).hexdigest()=="fa627fa31932f278efa5a8ad6ec5155be5fb9e40899ddc421380d18f7d07a75a"
          op=tmp/"overlay.zip";op.write_bytes(raw)
          with zipfile.ZipFile(op) as z:z.extractall(tmp)
          (tmp/"OVERLAY_MANIFEST.json").unlink(missing_ok=True);op.unlink(missing_ok=True)
          for p in tmp.iterdir():
              d=out/p.name
              shutil.copytree(p,d,dirs_exist_ok=True) if p.is_dir() else shutil.copy2(p,d)

      - name: Audit exact source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upgrade-evidence | Out-Null
          python scripts/public-release-audit-v3218.py --root upgrade-source --out upgrade-evidence/source-audit.json

      - name: Apply ace public identity/startup overlay
        shell: pwsh
        run: |
          python scripts/apply-release-identity-v3219.py --foundation upgrade-source/foundation_0_3_6 --report upgrade-evidence/identity-overlay.json

      - name: Build upgrade and certify version-to-version path
        shell: pwsh
        run: |
          .\scripts\certify-version-upgrade-v32114.ps1 -ArtifactRoot .\frozen-rc2 -FoundationPath .\upgrade-source\foundation_0_3_6 -FrontendPath .\upgrade-source\frontend_v3_21_0 -OutputDirectory .\upgrade-evidence

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '# CELE v3.21.14 — Version Upgrade Certification'
          $p='upgrade-evidence\v3.21.14-version-upgrade-report.json'
          if(Test-Path $p){
            $r=Get-Content -Raw $p | ConvertFrom-Json
            Add-Content $env:GITHUB_STEP_SUMMARY "- **Status:** $($r.status)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- **From:** $($r.sourceRc2.version)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- **To:** $($r.upgradeCandidate.version)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- **Pre-upgrade IPC:** $($r.preUpgrade.ipc.status) ($($r.preUpgrade.ipc.checkCount)/13)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- **Post-upgrade IPC:** $($r.upgrade.ipc.status) ($($r.upgrade.ipc.checkCount)/13)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- **User-data persistence:** $($r.userDataPersistence)"
            Add-Content $env:GITHUB_STEP_SUMMARY '- **releaseReady:** false'
          }

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CELE-v3.21.14-version-upgrade-evidence
          path: upgrade-evidence/**
          if-no-files-found: warn
          retention-days: 90
